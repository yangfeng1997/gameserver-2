sock_path: "/tmp/routeragent/ra.sock"
listen_addr: "127.0.0.1:7100"
heartbeat_sec: 30

logger_group:
  main:
    level: info
    format: console
    stderr_also: true
    dir: "../log"
    basename: routeragent
    max_size_mb: 100
    max_backups: 72
    rotate_by_hour: true
  res:
    level: info
    format: console
    stderr_also: true
    dir: "../log"
    basename: routeragent_res
    max_size_mb: 100
    max_backups: 72
    rotate_by_hour: true
  tracing:
    level: info
    format: console
    stderr_also: true
    dir: "../log"
    basename: routeragent_tracing
    max_size_mb: 100
    max_backups: 72
    rotate_by_hour: true
